name: Vérifier le fichier Compose

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Valider la syntaxe
        run: docker compose --env-file .env.exemple -f compose.yaml config --quiet
